<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Career Blueprint Assessment

</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<header class="assessment-header">

    <img
    src="images/xfactor-logo.png"
    alt="X Factor Logo"
    class="assessment-logo">

    <h2>

        Career Blueprint Assessment

    </h2>

</header>

<section class="assessment-container">
    <div class="logo">
    <img src="images/logo.png" alt="X Factor Logo">
</div>

    <div class="assessment-top">

        <div class="question-counter">

            Question

            <span id="questionNumber">

                1

            </span>

            / 200

        </div>

        <div class="progress-container">

            <div
            id="progressBar"
            class="progress-bar">

            </div>

        </div>

    </div>

    <div class="question-box">

        <div
        id="testCategory"
        class="test-category">

            IKIGAI TEST

        </div>

        <h2
        id="questionText">

            What kind of activity makes you feel most alive?

        </h2>

        <div
        id="optionsContainer">

            <button class="option">

                Helping People

            </button>

            <button class="option">

                Creating New Things

            </button>

            <button class="option">

                Solving Problems

            </button>

            <button class="option">

                Leading Others

            </button>

        </div>

        <button
        id="continueBtn"
        class="continue-btn">

            Continue

        </button>

    </div>

</section>

<script src="assessment.js"></script>

</body>

</html>
